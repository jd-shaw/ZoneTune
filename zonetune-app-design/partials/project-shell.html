<!-- ZoneTune App Shell — Mobile 375px -->
<!-- Requires: colors_and_type.css, Google Fonts CDN, Tailwind CSS -->

<div class="app-shell flex flex-col min-h-screen" style="background:var(--brand-background);color:var(--brand-ink);font-family:var(--font-body);">

  <!-- ═══════════ SLOT: pageContent ═══════════ -->
  <!-- SLOT: pageContent -->


  <!-- ═══════════ Mini Player Bar ═══════════ -->
  <div class="flex-shrink-0" style="background:var(--brand-surface);border-top:1px solid var(--brand-line);">
    <!-- progress rail -->
    <div style="height:2px;background:var(--brand-line);">
      <div style="width:35%;height:100%;background:var(--brand-steel);border-radius:1px;"></div>
    </div>

    <!-- clickable row -->
    <div
      data-dom-id="mini-expand"
      class="flex items-center gap-3 px-4 py-2 cursor-pointer select-none"
    >
      <!-- album cover -->
      <img
        src="../assets/album-cover-1.jpg"
        alt=""
        class="flex-shrink-0 object-cover"
        style="width:40px;height:40px;border-radius:var(--radius-sm,8px);"
      />

      <!-- track info -->
      <div class="flex-1 min-w-0">
        <p class="truncate" style="font-size:var(--text-body-sm,14px);font-weight:600;color:var(--brand-ink);line-height:var(--text-body-sm-leading,20px);">
          晚风漫步
        </p>
        <p class="truncate" style="font-size:var(--text-caption,12px);color:var(--brand-mute);line-height:var(--text-caption-leading,16px);">
          林声
        </p>
      </div>

      <!-- transport controls -->
      <div class="flex items-center gap-2 flex-shrink-0">
        <!-- play / pause -->
        <button
          class="flex items-center justify-center"
          style="width:36px;height:36px;border-radius:var(--radius-full,9999px);background:var(--brand-steel);border:none;"
          aria-label="播放/暂停"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="white">
            <!-- pause icon (default state) -->
            <rect x="6" y="4" width="4" height="16" rx="1"/>
            <rect x="14" y="4" width="4" height="16" rx="1"/>
          </svg>
        </button>
        <!-- skip next -->
        <button
          class="flex items-center justify-center"
          style="width:32px;height:32px;border:none;background:transparent;"
          aria-label="下一首"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--brand-mute)">
            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>


  <!-- ═══════════ Bottom Navigation Bar ═══════════ -->
  <nav
    class="flex-shrink-0 flex items-center justify-around"
    style="background:var(--brand-surface);border-top:1px solid var(--brand-line);padding:6px 0 env(safe-area-inset-bottom,8px);"
  >

    <!-- SLOT: activeNavItem — set on the matching tab -->

    <!-- 发现 / Discover -->
    <a
      href="discover.html"
      data-dom-id="tab-discover"
      class="flex flex-col items-center gap-0.5 flex-1 py-1 no-underline"
      style="text-decoration:none;"
    >
      <span class="tab-icon" style="width:40px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md,12px);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
        </svg>
      </span>
      <span class="tab-label" style="font-size:var(--text-label,11px);line-height:var(--text-label-leading,14px);">
        发现
      </span>
    </a>

    <!-- 搜索 / Search -->
    <a
      href="search.html"
      data-dom-id="tab-search"
      class="flex flex-col items-center gap-0.5 flex-1 py-1 no-underline"
      style="text-decoration:none;"
    >
      <span class="tab-icon" style="width:40px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md,12px);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
      </span>
      <span class="tab-label" style="font-size:var(--text-label,11px);line-height:var(--text-label-leading,14px);">
        搜索
      </span>
    </a>

    <!-- 我的 / Mine -->
    <a
      href="mine.html"
      data-dom-id="tab-mine"
      class="flex flex-col items-center gap-0.5 flex-1 py-1 no-underline"
      style="text-decoration:none;"
    >
      <span class="tab-icon" style="width:40px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md,12px);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
      </span>
      <span class="tab-label" style="font-size:var(--text-label,11px);line-height:var(--text-label-leading,14px);">
        我的
      </span>
    </a>

  </nav>

</div>


<!-- ═══════════ Active-Tab Style Switch (apply via SLOT: activeNavItem) ═══════════ -->
<!--
  To mark a tab as active, inject an inline style override on the <a> element:
    style="text-decoration:none;color:var(--brand-steel);"
  And on its .tab-icon child:
    style="...background:var(--brand-steel-light);..."
  Inactive tabs keep:
    style="text-decoration:none;color:var(--brand-mute);"
  with .tab-icon background transparent.

  Example — Discover is active:
    <!-- SLOT: activeNavItem -->
    <style>
      [data-dom-id="tab-discover"] { color: var(--brand-steel) !important; }
      [data-dom-id="tab-discover"] .tab-icon { background: var(--brand-steel-light) !important; }
      [data-dom-id="tab-search"] { color: var(--brand-mute) !important; }
      [data-dom-id="tab-mine"]  { color: var(--brand-mute) !important; }
    </style>
-->
